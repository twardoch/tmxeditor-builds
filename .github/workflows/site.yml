# this_file: .github/workflows/site.yml
name: Update website
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build distributables]
    types: [completed]
  release:
    types: [published, edited, deleted, released, prereleased]
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'site/**'
      - 'scripts/site.mjs'
      - 'package*.json'
      - '.github/workflows/site.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: update-website
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Generate website from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run site
      - name: Commit generated website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update website downloads and instructions"
            git push origin HEAD:main
          fi
      - name: Request branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
